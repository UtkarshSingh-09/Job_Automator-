[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-agent"
version = "0.1.0"
description = "Autonomous Internship-Matching, Resume Generation & Auto-Apply System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Utkarsh Singh" }
]
dependencies = [
    "click>=8.1.7",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "pyyaml>=6.0.1",
    "pymupdf>=1.24.0",
    "playwright>=1.40.0",
    "numpy>=1.26.0",
]

[project.scripts]
resume-agent = "resume_agent.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_agent"]
